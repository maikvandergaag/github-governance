name: Bug report
description: Report a reproducible problem with GitHub Governance.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, private keys, customer data, or unredacted account snapshots."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the error message, with secrets and private data removed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Share the smallest set of steps using non-sensitive or fixture data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the module version or Git commit and PowerShell version, if known.
    validations:
      required: false
