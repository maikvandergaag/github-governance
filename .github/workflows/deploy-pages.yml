name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install MkDocs
        run: python -m pip install mkdocs==1.6.1
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare documentation
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
          TREE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages-src/docs"
          cp ./*.md LICENSE "$RUNNER_TEMP/pages-src/"
          rsync -a --exclude='/output/' docs/ "$RUNNER_TEMP/pages-src/docs/"
          find tests -mindepth 2 -maxdepth 2 -type f \( -name README.md -o -name issue.md \) | while IFS= read -r file; do
            mkdir -p "$RUNNER_TEMP/pages-src/$(dirname "$file")"
            : > "$RUNNER_TEMP/pages-src/$file"
            if [ "$(basename "$file")" = issue.md ]; then
              printf '%s\n\n' 'This is an issue template; placeholders are filled in when a finding is reported.' >> "$RUNNER_TEMP/pages-src/$file"
            fi
            sed -e 's|\[{{target}}\]({{target_url}})|`{{target}}`|g' \
                -e 's|\[Generated documentation\]({{docs_url}})|`{{docs_url}}`|g' \
                "$file" >> "$RUNNER_TEMP/pages-src/$file"
          done
          sed -e "s|../compliance/policy.json|${SOURCE_URL}/compliance/policy.json|g" \
              "$RUNNER_TEMP/pages-src/docs/checks.md" > "$RUNNER_TEMP/checks.md"
          mv "$RUNNER_TEMP/checks.md" "$RUNNER_TEMP/pages-src/docs/checks.md"
          sed "s|../../.github/workflows/governance-assessment.yml|${SOURCE_URL}/.github/workflows/governance-assessment.yml|g" "$RUNNER_TEMP/pages-src/docs/configuration/07-operations-and-troubleshooting.md" > "$RUNNER_TEMP/operations.md"
          mv "$RUNNER_TEMP/operations.md" "$RUNNER_TEMP/pages-src/docs/configuration/07-operations-and-troubleshooting.md"
          sed "s|../../tests/|${TREE_URL}/tests/|g" "$RUNNER_TEMP/pages-src/docs/repo/README.md" > "$RUNNER_TEMP/repo.md"
          mv "$RUNNER_TEMP/repo.md" "$RUNNER_TEMP/pages-src/docs/repo/README.md"
          cp mkdocs.yml "$RUNNER_TEMP/mkdocs.yml"
      - name: Build site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: mkdocs build --strict --config-file "$RUNNER_TEMP/mkdocs.yml"
      - name: Check site links
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python tests/validate-pages-links.py "$RUNNER_TEMP/pages-site" "$PAGES_URL"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
