name: Check - GitHub Platform

on:
  schedule:
    - cron: '17 5 * * 1' # Every Monday 05:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: Account mode
        type: choice
        required: true
        default: enterprise
        options:
          - enterprise
          - organization
          - user
      documentation:
        description: Generate and publish documentation
        type: boolean
        default: true
      compliance:
        description: Run compliance tests
        type: boolean
        default: true
      sync_issues:
        description: Create and synchronize compliance issues (requires compliance tests)
        type: boolean
        default: true
      target_repository_issues:
        description: Create repository findings in their target repositories
        type: boolean
        default: false
      publish_sarif:
        description: Publish results to code scanning (requires compliance tests)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: governance-assessment
  cancel-in-progress: false

env:
  ENTERPRISE_SLUG: ${{ vars.ENTERPRISE_SLUG }}
  ACCOUNT_SCOPE: ${{ inputs.mode || vars.ACCOUNT_SCOPE || 'enterprise' }}
  ACCOUNT_LOGIN: ${{ vars.ACCOUNT_LOGIN }}
  RUN_DOCUMENTATION: ${{ github.event_name == 'schedule' || inputs.documentation }}
  RUN_COMPLIANCE: ${{ github.event_name == 'schedule' || inputs.compliance }}
  RUN_SARIF: ${{ github.event_name == 'schedule' || inputs.publish_sarif }}
  RUN_ISSUES: ${{ (github.event_name == 'schedule' && vars.SYNC_ISSUES != 'false') || (github.event_name == 'workflow_dispatch' && inputs.sync_issues) }}
  TARGET_REPOSITORY_ISSUES: ${{ (github.event_name == 'schedule' && vars.TARGET_REPOSITORY_ISSUES == 'true') || (github.event_name == 'workflow_dispatch' && inputs.target_repository_issues) }}
  DOCS_PUBLISH_MODE: ${{ vars.DOCS_PUBLISH_MODE || 'pull_request' }}
  ENTERPRISE_API_URL: ${{ vars.ENTERPRISE_API_URL || 'https://api.github.com' }}
  OUTPUT_PATH: docs/output
  MODULE_PATH: ./src/GitHubGovernance/GitHubGovernance.psd1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # Environment secrets (GH_APP_PRIVATE_KEY) are only released to runs on the branches the
    # environment allows (main). See docs/configuration/03-setup.md.
    environment: enterprise-compliance
    outputs:
      documentation: ${{ steps.selections.outputs.documentation }}
      compliance: ${{ steps.selections.outputs.compliance }}
      sarif: ${{ steps.selections.outputs.sarif }}
      issues: ${{ steps.selections.outputs.issues }}
      target_repository_issues: ${{ steps.selections.outputs.target_repository_issues }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate configuration
        shell: pwsh
        env:
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUN_SARIF -eq 'true' -and $env:RUN_COMPLIANCE -ne 'true') {
            throw 'SARIF publishing requires compliance tests to be selected.'
          }
          if ($env:DOCS_PUBLISH_MODE -notin 'pull_request', 'direct') {
            throw 'DOCS_PUBLISH_MODE must be pull_request or direct.'
          }
          if ($env:RUN_DOCUMENTATION -ne 'true' -and $env:RUN_COMPLIANCE -ne 'true') {
            Write-Host 'No documentation or compliance actions selected.'
            return
          }
          $missing = [System.Collections.Generic.List[string]]::new()
          if ($env:ACCOUNT_SCOPE -notin 'enterprise', 'organization', 'user') {
            throw "Invalid account mode. Use enterprise, organization, or user."
          }
          if ($env:ACCOUNT_SCOPE -eq 'enterprise' -and [string]::IsNullOrWhiteSpace($env:ENTERPRISE_SLUG)) {
            $missing.Add('ENTERPRISE_SLUG')
          }
          if ($env:ACCOUNT_SCOPE -in 'organization', 'user' -and [string]::IsNullOrWhiteSpace($env:ACCOUNT_LOGIN)) {
            $missing.Add('ACCOUNT_LOGIN')
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_APP_CLIENT_ID)) { $missing.Add('GH_APP_CLIENT_ID') }
          if ([string]::IsNullOrWhiteSpace($env:GH_APP_PRIVATE_KEY)) { $missing.Add('GH_APP_PRIVATE_KEY environment secret') }
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) { $missing.Add('GITHUB_TOKEN') }
          if ($missing.Count) {
            throw "Missing required configuration: $($missing -join ', '). See docs/repo/SETUP.md."
          }
          $api = $null
          if (-not [uri]::TryCreate($env:ENTERPRISE_API_URL, [UriKind]::Absolute, [ref]$api) -or
              $api.Scheme -ne 'https' -or -not $api.Host -or $api.UserInfo -or $api.Query -or $api.Fragment) {
            throw 'ENTERPRISE_API_URL must be an HTTPS URL without user information, a query, or a fragment.'
          }
          Write-Host "Required configuration is present for $($env:ACCOUNT_SCOPE) mode."

      - name: Validate GitHub App authentication
        if: ${{ env.RUN_DOCUMENTATION == 'true' || env.RUN_COMPLIANCE == 'true' }}
        shell: pwsh
        env:
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module $env:MODULE_PATH -Force
          $scope = switch ($env:ACCOUNT_SCOPE) {
            'enterprise' { @{ Enterprise = $env:ENTERPRISE_SLUG } }
            'organization' { @{ Organization = $env:ACCOUNT_LOGIN } }
            'user' { @{ User = $env:ACCOUNT_LOGIN } }
            default { throw 'Invalid account mode.' }
          }
          try {
            Connect-GHGovernance @scope -AppClientId $env:GH_APP_CLIENT_ID -AppPrivateKey $env:GH_APP_PRIVATE_KEY -ApiBaseUrl $env:ENTERPRISE_API_URL | Out-Null
            if ($env:ACCOUNT_SCOPE -eq 'user') {
              Get-GHRepository -Organization $env:ACCOUNT_LOGIN -IncludeArchived -ErrorAction Stop | Out-Null
            } else {
              Get-GHOrganization -ErrorAction Stop | Out-Null
            }
            Write-Host "GitHub App authentication and account access verified."
          } finally {
            Disconnect-GHGovernance
          }

      - name: Record selected actions
        id: selections
        shell: pwsh
        run: |
          "documentation=$env:RUN_DOCUMENTATION" >> $env:GITHUB_OUTPUT
          "compliance=$env:RUN_COMPLIANCE" >> $env:GITHUB_OUTPUT
          "sarif=$env:RUN_SARIF" >> $env:GITHUB_OUTPUT
          "issues=$env:RUN_ISSUES" >> $env:GITHUB_OUTPUT
          "target_repository_issues=$env:TARGET_REPOSITORY_ISSUES" >> $env:GITHUB_OUTPUT

  inventory:
    needs: validate
    if: ${{ needs.validate.outputs.documentation == 'true' || needs.validate.outputs.compliance == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    environment: enterprise-compliance
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Collect documentation and inventory
        shell: pwsh
        env:
          # GitHub App installed on the enterprise and every organization.
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          Import-Module $env:MODULE_PATH -Force
          $scope = switch ($env:ACCOUNT_SCOPE) {
            'enterprise' { @{ Enterprise = $env:ENTERPRISE_SLUG } }
            'organization' { @{ Organization = $env:ACCOUNT_LOGIN } }
            'user' { @{ User = $env:ACCOUNT_LOGIN } }
            default { throw "Invalid ACCOUNT_SCOPE: $env:ACCOUNT_SCOPE" }
          }
          Connect-GHGovernance @scope -AppClientId $env:GH_APP_CLIENT_ID -AppPrivateKey $env:GH_APP_PRIVATE_KEY -ApiBaseUrl $env:ENTERPRISE_API_URL | Format-List
          Export-GHDocumentation -OutputPath $env:OUTPUT_PATH
          Disconnect-GHGovernance

      - name: Prepare documentation patch
        shell: bash
        run: |
          git add -f -A "$OUTPUT_PATH"
          git diff --cached --binary -- "$OUTPUT_PATH" > generated-docs.patch

      - name: Upload documentation patch
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: documentation-patch
          path: generated-docs.patch
          if-no-files-found: error

  pester:
    needs: [validate, inventory]
    if: ${{ needs.validate.outputs.compliance == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    environment: enterprise-compliance
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download documentation patch
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: documentation-patch

      - name: Restore documentation
        shell: bash
        run: |
          if [ -s generated-docs.patch ]; then
            git apply --index --whitespace=nowarn generated-docs.patch
          fi

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -ErrorAction Stop

      # Evaluated before the commit so the findings report is part of the docs commit.
      - name: Evaluate compliance with Pester
        id: evaluate
        shell: pwsh
        env:
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          Import-Module $env:MODULE_PATH -Force
          $scope = switch ($env:ACCOUNT_SCOPE) {
            'enterprise' { @{ Enterprise = $env:ENTERPRISE_SLUG } }
            'organization' { @{ Organization = $env:ACCOUNT_LOGIN } }
            'user' { @{ User = $env:ACCOUNT_LOGIN } }
            default { throw "Invalid ACCOUNT_SCOPE: $env:ACCOUNT_SCOPE" }
          }
          Connect-GHGovernance @scope -AppClientId $env:GH_APP_CLIENT_ID -AppPrivateKey $env:GH_APP_PRIVATE_KEY -ApiBaseUrl $env:ENTERPRISE_API_URL | Out-Null
          $params = @{
            UsePester = $true
            DataPath = "$env:OUTPUT_PATH/_data"
            PolicyPath = './compliance/policy.json'
            OutputFile = './compliance-findings.json'
            DocsPath = $env:OUTPUT_PATH
            ReportFile = "$env:OUTPUT_PATH/compliance/README.md"
          }
          try { $findings = Test-GHCompliance @params }
          finally { Disconnect-GHGovernance }
          Write-Host "$(@($findings | Where-Object { $_.failures }).Count) non-compliant target(s)."

      - name: Prepare generated documentation
        shell: bash
        run: |
          test -f compliance-findings.json
          # A patch preserves added, changed and deleted generated files across jobs.
          git add -f -A "$OUTPUT_PATH"
          git diff --cached --binary -- "$OUTPUT_PATH" > enterprise-docs.patch

      - name: Upload findings and documentation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: compliance-findings
          path: |
            compliance-findings.json
            enterprise-docs.patch
          if-no-files-found: error

  commit_docs:
    needs: [validate, inventory, pester]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.inventory.result == 'success' && needs.validate.outputs.documentation == 'true' && (needs.validate.outputs.compliance != 'true' || needs.pester.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    environment: enterprise-compliance
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      docs_committed: ${{ steps.commit.outputs.docs_committed }}
    steps:
      - name: Create documentation publishing App token
        if: ${{ env.DOCS_PUBLISH_MODE == 'pull_request' }}
        id: docs-app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.docs-app-token.outputs.token || secrets.DOCS_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download findings and documentation
        if: ${{ needs.validate.outputs.compliance == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: compliance-findings

      - name: Download documentation patch
        if: ${{ needs.validate.outputs.compliance != 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: documentation-patch

      - name: Commit changes
        id: commit
        shell: bash
        env:
          RUN_COMPLIANCE: ${{ needs.validate.outputs.compliance }}
          GH_TOKEN: ${{ steps.docs-app-token.outputs.token || secrets.DOCS_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ steps.docs-app-token.outputs.token || secrets.DOCS_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "docs_committed=false" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          patch=generated-docs.patch
          if [ "$RUN_COMPLIANCE" = "true" ]; then
            patch=enterprise-docs.patch
          fi
          if [ -s "$patch" ]; then
            git apply --index --whitespace=nowarn "$patch"
          fi

          branch=""
          old_sha=""
          pr_number=""
          if [ "$DOCS_PUBLISH_MODE" = "pull_request" ]; then
            export GH_HOST="${GITHUB_SERVER_URL#https://}"
            export GH_REPO="$GH_HOST/$GITHUB_REPOSITORY"
            branch="github-governance/docs-$(printf '%s' "$GITHUB_REF_NAME" | git hash-object --stdin)"
            remote_ref="refs/heads/$branch"
            old_sha=$(git ls-remote --heads origin "$remote_ref" | cut -f1)
            if [ -n "$old_sha" ]; then
              git fetch --no-tags origin "$remote_ref"
              old_sha=$(git rev-parse FETCH_HEAD)
              parent=$(git rev-parse "$old_sha^")
              [ "$(git rev-list --parents -n 1 "$old_sha" | wc -w | tr -d ' ')" = "2" ] || { echo "Refusing to overwrite a merged publishing branch." >&2; exit 1; }
              [ "$(git log -1 --format=%s "$old_sha")" = "docs: update GitHub Governance inventory" ] || { echo "Refusing to overwrite an unmanaged publishing branch." >&2; exit 1; }
              [ "$(git log -1 --format=%ae "$old_sha")" = "41898282+github-actions[bot]@users.noreply.github.com" ] || { echo "Refusing to overwrite a modified publishing branch." >&2; exit 1; }
              [ "$(git log -1 --format=%ce "$old_sha")" = "41898282+github-actions[bot]@users.noreply.github.com" ] || { echo "Refusing to overwrite a modified publishing branch." >&2; exit 1; }
              git merge-base --is-ancestor "$parent" HEAD || { echo "Publishing branch is not based on this target branch." >&2; exit 1; }
              if ! git diff --quiet "$parent" "$old_sha" -- . ":(exclude)$OUTPUT_PATH"; then
                echo "Publishing branch contains changes outside $OUTPUT_PATH." >&2
                exit 1
              fi
            fi
            pr_number=$(gh pr list --head "$branch" --base "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
            if [ -n "$pr_number" ] && ! gh pr view "$pr_number" --json body --jq .body | grep -Fxq '<!-- github-governance:managed-docs -->'; then
              echo "Refusing to modify an unmanaged pull request." >&2
              exit 1
            fi
          fi

          # README.md always changes (timestamp); only publish when something else changed.
          if git diff --cached --quiet -- "$OUTPUT_PATH" ":(exclude)$OUTPUT_PATH/README.md"; then
            echo "No configuration changes detected."
            git reset --quiet
            if [ -n "$pr_number" ] && [ -n "$old_sha" ]; then
              gh pr close "$pr_number" --comment "The latest inventory matches the target branch; closing this outdated proposal."
            fi
            exit 0
          fi

          {
            echo "### Configuration changes detected"
            echo '```'
            git diff --cached --stat -- "$OUTPUT_PATH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DOCS_PUBLISH_MODE" = "direct" ]; then
            git commit -m "docs: update GitHub Enterprise documentation ($(date -u +%Y-%m-%d))"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "docs_committed=true" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs: update GitHub Governance inventory"
            git push --force-with-lease="$remote_ref:$old_sha" origin "HEAD:$remote_ref"
            if [ -z "$pr_number" ]; then
              gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
                --title "docs: update GitHub Governance inventory" \
                --body $'<!-- github-governance:managed-docs -->\n## Summary\n\n<!-- What changed and why? -->\nUpdate generated GitHub Governance documentation.\n\n## Validation\n\nGenerated by the documentation workflow; review the workflow run for results.\n\n- [ ] `Invoke-Pester -Path ./tests/validation`\n- [ ] `pwsh ./tests/Invoke-SmokeTest.ps1`\n- [ ] Documentation updated, if needed\n\n## Risk and compatibility\n\n<!-- Note changes to permissions, collected data, or compatibility. Write "None" if not applicable. -->\nGenerated documentation may include sensitive account metadata.'
            fi
          fi

  publish_sarif:
    needs: [validate, pester, commit_docs]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.sarif == 'true' && needs.pester.result == 'success' && (needs.validate.outputs.documentation != 'true' || needs.commit_docs.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.commit_docs.outputs.sha || github.sha }}

      - name: Download findings
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: compliance-findings

      - name: Convert findings to SARIF
        shell: pwsh
        env:
          RESULT_COMMIT: ${{ needs.commit_docs.outputs.sha || github.sha }}
          DOCS_COMMITTED: ${{ needs.commit_docs.outputs.docs_committed }}
        run: |
          Import-Module $env:MODULE_PATH -Force
          ConvertTo-GHComplianceSarif -FindingsFile ./compliance-findings.json -OutputFile ./compliance.sarif -Commit $env:RESULT_COMMIT -UsePolicyLocations:($env:DOCS_COMMITTED -ne 'true')

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: compliance.sarif
          category: github-enterprise-compliance
          # PR publishing uses the original commit; direct publishing uses the new docs commit.
          sha: ${{ needs.commit_docs.outputs.sha || github.sha }}
          ref: ${{ github.ref }}

      - name: Summarize SARIF publication
        shell: bash
        run: echo 'Compliance results were uploaded to Security > Code scanning.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: compliance-sarif
          path: compliance.sarif
          if-no-files-found: ignore

  summarize:
    needs: [validate, pester]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.sarif == 'false' && (needs.validate.outputs.compliance != 'true' || needs.pester.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download findings
        if: ${{ needs.validate.outputs.compliance == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: compliance-findings

      - name: Summarize compliance
        shell: pwsh
        env:
          RUN_COMPLIANCE: ${{ needs.validate.outputs.compliance }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('## Compliance results')
          $lines.Add('')
          if ($env:RUN_COMPLIANCE -ne 'true') {
            $lines.Add('Compliance tests were not selected; no SARIF was published.')
          } else {
            $targets = @(Get-Content ./compliance-findings.json -Raw | ConvertFrom-Json -Depth 20)
            $failures = @($targets | ForEach-Object { $_.failures } | Where-Object { $_ })
            $notEvaluated = @($targets | ForEach-Object { $_.notEvaluated } | Where-Object { $_ })
            $lines.Add('SARIF publishing was not selected.')
            $lines.Add('')
            $lines.Add('| Metric | Count |')
            $lines.Add('| --- | ---: |')
            $lines.Add("| Targets evaluated | $($targets.Count) |")
            $lines.Add("| Failed checks | $($failures.Count) |")
            $lines.Add("| Checks not evaluated | $($notEvaluated.Count) |")
            foreach ($severity in 'high', 'medium', 'low') {
              $count = @($failures | Where-Object { $_.severity -eq $severity }).Count
              $lines.Add("| $severity severity findings | $count |")
            }
            if ($failures.Count) {
              $lines.Add('')
              $lines.Add('| Failed requirement | Count |')
              $lines.Add('| --- | ---: |')
              foreach ($group in @($failures | Group-Object check | Sort-Object Name)) {
                $name = $group.Name -replace '[\r\n|]', ' '
                $lines.Add("| ``$name`` | $($group.Count) |")
              }
            }
          }
          ($lines -join "`n") + "`n" | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

  sync-issues:
    needs: [validate, pester]
    if: ${{ needs.validate.outputs.compliance == 'true' && needs.validate.outputs.issues == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: enterprise-compliance
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download findings
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: compliance-findings

      - name: Sync compliance issues
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          TARGET_REPOSITORY_ISSUES: ${{ needs.validate.outputs.target_repository_issues }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module $env:MODULE_PATH -Force
          $targetRepositories = $env:TARGET_REPOSITORY_ISSUES -eq 'true'
          try {
            if ($targetRepositories) {
              $scope = switch ($env:ACCOUNT_SCOPE) {
                'enterprise' { @{ Enterprise = $env:ENTERPRISE_SLUG } }
                'organization' { @{ Organization = $env:ACCOUNT_LOGIN } }
                'user' { @{ User = $env:ACCOUNT_LOGIN } }
                default { throw "Invalid ACCOUNT_SCOPE: $env:ACCOUNT_SCOPE" }
              }
              Connect-GHGovernance @scope -AppClientId $env:GH_APP_CLIENT_ID -AppPrivateKey $env:GH_APP_PRIVATE_KEY -ApiBaseUrl $env:ENTERPRISE_API_URL | Out-Null
            }
            Sync-GHComplianceIssue -FindingsFile './compliance-findings.json' -Scope $env:ACCOUNT_SCOPE -Account $env:ACCOUNT_LOGIN -ApiBaseUrl $env:ENTERPRISE_API_URL -IssuesInTargetRepositories:$targetRepositories
          } finally {
            if ($targetRepositories) { Disconnect-GHGovernance }
          }
